<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrettyGit</title>
    <link href="./popup.css" rel="stylesheet" />
    <script src="./options.js" defer></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <a
          class="brand"
          href="https://github.com/cristianmacedo/prettygit"
          target="_blank"
          rel="noreferrer"
        >
          <img src="./assets/images/prettygit-128.png" alt="PrettyGit" />
          <div>
            <h1>PrettyGit</h1>
            <p>Format GitHub pull requests and issues for sharing.</p>
          </div>
        </a>
      </header>

      <form id="options-form" class="card">
        <section class="field-group">
          <div class="field-copy">
            <h2>Output Template</h2>
            <p>
              Use HTML for rich paste targets. Dynamic values are safely escaped
              before they are injected.
            </p>
          </div>
          <label class="field" for="pullRequestTemplate">
            <span>Template</span>
            <textarea
              id="pullRequestTemplate"
              rows="7"
              placeholder="Write your template here..."
            ></textarea>
          </label>
          <div class="tokens" aria-label="Available variables">
            <code>issue.title</code>
            <code>issue.number</code>
            <code>issue.type</code>
            <code>issue.url</code>
            <code>repo.title</code>
            <code>repo.url</code>
            <code>org.title</code>
            <code>org.url</code>
          </div>
        </section>

        <section class="field-group">
          <label class="field" for="repoTitleRemove">
            <span>Repository Prefix To Remove</span>
            <input
              id="repoTitleRemove"
              type="text"
              placeholder="some-prefix_"
            />
          </label>
        </section>

        <footer class="actions">
          <button type="button" id="reset" class="secondary">Reset</button>
          <span id="status" class="status" aria-live="polite"></span>
          <button type="submit" class="primary">Save</button>
        </footer>
      </form>
    </main>
  </body>
</html>
